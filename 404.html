<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0C0B0B" />
  <link rel="icon" type="image/png" href="images/lioo-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body class="subpage">

    <section class="page-hero">
      <div class="page-wrap"><div class="page-hero-content">
        <span class="page-eyebrow">404</span>
        <h1 class="page-title">This page is<br /><span class="gradient-text">out of style.</span></h1>
        <p class="page-lead">The page you requested does not exist or has moved.</p>
        <a id="home-link" href="./" class="btn-primary" style="margin-top: 34px">Back to Lioo</a>

  <script>
    if (window.location.hostname.endsWith('github.io')) {
      document.getElementById('home-link').href = '/lioo-website/';
    }
  </script>
